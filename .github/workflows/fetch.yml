name: Fetch food truck bookings

on:
  # Run every 15 minutes
  schedule:
    - cron: "*/15 * * * *"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:
  # Also run on push to test changes immediately
  push:
    paths:
      - "fetch_tfc.py"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fetcher
        run: python fetch_tfc.py

      - name: Commit if changed
        run: |
          git config user.name  "rock-oak-foodtrucks-bot"
          git config user.email "actions@github.com"
          # Stage events.json; ignore touch-only changes (only fetchedAt diff)
          git add events.json
          # Check if anything other than the fetchedAt timestamp changed
          if git diff --cached --quiet; then
            echo "No changes to events.json"
            exit 0
          fi
          # Check if only fetchedAt changed (avoid noisy commits when no bookings changed)
          DIFF=$(git diff --cached --no-color events.json | grep -E '^[+-]' | grep -v '^[+-]{3}' || true)
          NON_TIMESTAMP=$(echo "$DIFF" | grep -v 'fetchedAt' || true)
          if [ -z "$NON_TIMESTAMP" ]; then
            echo "Only fetchedAt changed — skipping commit"
            git reset HEAD events.json
            exit 0
          fi
          git commit -m "Update bookings: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
