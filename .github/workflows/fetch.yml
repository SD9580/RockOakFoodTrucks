name: Fetch food truck bookings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "fetch_tfc.py"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fetcher
        run: python fetch_tfc.py

      - name: Commit if changed
        run: |
          git config user.name  "rock-oak-foodtrucks-bot"
          git config user.email "actions@github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "No changes to events.json"
            exit 0
          fi
          DIFF=$(git diff --cached --no-color events.json | grep -E '^[+-]' | grep -vE '^[+-]{3}' || true)
          NON_TIMESTAMP=$(echo "$DIFF" | grep -v 'fetchedAt' || true)
          if [ -z "$NON_TIMESTAMP" ]; then
            echo "Only fetchedAt changed — skipping commit"
            git reset HEAD events.json
            exit 0
          fi
          git commit -m "Update bookings: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Be resilient to concurrent commits to main (e.g. while we were running)
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1
